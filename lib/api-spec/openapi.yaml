openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Marketplace API for listings, demo checkout, seller operations, and order fulfillment
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Marketplace storefront and operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /marketplace/products:
    get:
      operationId: listProducts
      tags: [marketplace]
      summary: List marketplace products
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [marketplace]
      summary: Create a seller listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /marketplace/products/{productId}:
    patch:
      operationId: updateProduct
      tags: [marketplace]
      summary: Update a listing or inventory
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { description: Product not found }
    delete:
      operationId: deleteProduct
      tags: [marketplace]
      summary: Remove a listing
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Listing removed }
        "404": { description: Product not found }
  /marketplace/orders:
    get:
      operationId: listOrders
      tags: [marketplace]
      summary: List marketplace orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [marketplace]
      summary: Place an order using demo checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { description: Insufficient inventory }
  /marketplace/orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [marketplace]
      summary: Update fulfillment status
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusInput" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: Order not found }
  /marketplace/dashboard:
    get:
      operationId: getMarketplaceDashboard
      tags: [marketplace]
      summary: Get marketplace operations summary
      responses:
        "200":
          description: Operations summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceDashboard" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, title, description, priceCents, category, imageUrl, sellerName, inventory, featured, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        priceCents: { type: integer }
        category: { type: string }
        imageUrl: { type: string }
        sellerName: { type: string }
        inventory: { type: integer }
        featured: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [title, description, priceCents, category, imageUrl, inventory]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        category: { type: string }
        imageUrl: { type: string }
        inventory: { type: integer, minimum: 0 }
        featured: { type: boolean }
    ProductUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        category: { type: string }
        imageUrl: { type: string }
        inventory: { type: integer, minimum: 0 }
        featured: { type: boolean }
    OrderLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    OrderInput:
      type: object
      required: [buyerName, email, address, items]
      properties:
        buyerName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        address: { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLineInput" }
    OrderLine:
      type: object
      required: [productId, title, quantity, unitPriceCents, imageUrl]
      properties:
        productId: { type: string }
        title: { type: string }
        quantity: { type: integer }
        unitPriceCents: { type: integer }
        imageUrl: { type: string }
    Order:
      type: object
      required: [id, buyerName, email, address, items, totalCents, status, paymentStatus, createdAt]
      properties:
        id: { type: string }
        buyerName: { type: string }
        email: { type: string }
        address: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        totalCents: { type: integer }
        status: { type: string, enum: [pending, processing, shipped, delivered, cancelled] }
        paymentStatus: { type: string, enum: [demo_paid, refunded] }
        createdAt: { type: string, format: date-time }
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, processing, shipped, delivered, cancelled] }
    MarketplaceDashboard:
      type: object
      required: [productCount, orderCount, grossSalesCents, lowStockCount, recentOrders]
      properties:
        productCount: { type: integer }
        orderCount: { type: integer }
        grossSalesCents: { type: integer }
        lowStockCount: { type: integer }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }

