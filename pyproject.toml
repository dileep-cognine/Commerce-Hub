[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Python dependencies for the Marketlane API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
